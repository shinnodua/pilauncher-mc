<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <title>Russia</title>
  <defs>
    <clipPath id="ru-clip">
      <rect width="640" height="480" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ru-clip)">
    <rect width="640" height="160" fill="#ffffff"/>
    <rect y="160" width="640" height="160" fill="#0039a6"/>
    <rect y="320" width="640" height="160" fill="#d52b1e"/>
  </g>
  <rect width="640" height="480" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="16" rx="24"/>
</svg>
